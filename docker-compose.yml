services:
  server:
    build: ./server
    container_name: vehicle-tracking_backend
    ports:
      - "9040:9040"
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - CLIENT_URL=http://localhost:9041
    restart: unless-stopped
    networks:
      - vehicle_network

  client:
    build: ./client
    container_name: vehicle-tracking_frontend
    ports:
      - "9041:9041"
    volumes:
      - ./client:/app
      - /app/node_modules
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - vehicle_network

networks:
  vehicle_network:
    driver: bridge
