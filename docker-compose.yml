services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vehicle-tracking_backend
    ports:
      - "9040:9040"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:9041
    restart: unless-stopped
    networks:
      - vehicle_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9040/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: vehicle-tracking_frontend
    ports:
      - "9041:9041"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vehicle_network

networks:
  vehicle_network:
    driver: bridge
